services:
  building_block:
    container_name: foundation
    image: postgres:latest
    ports:
    - "5432:5432"
    volumes:
    - /data/postgres:/data/postgres
    env_file:
    - docker.env
    networks:
    - postgres

  pgadmin:
    links:
    - building_block:foundation
    container_name: pgadmin
    image: dpage/pgadmin4:latest
    ports:
    - "8080:80"
    volumes:
    - /data/pgadmin:/root/.pgadmin
    env_file:
    - docker.env
    networks:
    - postgres
networks:
  postgres:
    driver: bridge

